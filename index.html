<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de estoque - V4</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <img src="paula.jpg" alt="">
        <div class="foto-perfil"></div>

        <h1>Cadastro de produto </h1>
        <form id="produto-form">
            <div class="form-group">
                <label for="nome">Nome do produto:</label>
                <input type="text" id="nome" placeholder="Ex: Notebook" required>
            </div>
            <div class="form-group">
                <label for="preco">Preço (R$):</label>
                <input type="number" id="preco" step="0.01" min="0.01" placeholder="Ex: 3500.00" required>
            </div>
            <div class="form-group">
                <label for="quantidade">Quantidade:</label>
                <input type="number" id="quantidade" min="1" step="1" placeholder="Ex: 5" required>
            </div>
            <button type="submit" class="btn-primary">Adicionar Produto</button>
            <button type="button" id="cancelar-edicao" class="btn-cancelar" hidden>Cancelar edição</button>
        </form>
        
        <div class="resumo-container">
            <h3 id="total-estoque">Total em estoque: R$ 0,00</h3>
            <button id="limpar-tabela" class="btn-danger" type="button">Limpar tudo</button>
        </div>

        <div class="busca-container">
            <label for="campo-busca">Pesquisar produto 🔍:</label>
            <input type="text" id="campo-busca" placeholder="Digite o nome do produto para filtrar...">
        </div>

        <table id="tabela-produtos">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Preço Un.</th>
                    <th>Qtd.</th>
                    <th>Subtotal</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
    <script src="script.js"></script>
</body>
</html>
